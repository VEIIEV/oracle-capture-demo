name: oracle-capture-demo
x-connect-env:
  CONNECT_BOOTSTRAP_SERVERS: kafka:29092
  CONNECT_REST_PORT: 8083
  CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
  CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
  CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
  CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
  CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
  CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/opt/plugins
  CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
  KAFKA_HEAP_OPTS: -Xms256m -Xmx1g

services:
  oracle:
    image: gvenzl/oracle-xe:21.3.0-slim-faststart
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: oracle
      TZ: UTC
    ports:
      - 127.0.0.1:1521:1521
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 60s
    shm_size: 1gb

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - 127.0.0.1:9092:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - kafka-topics
        - --bootstrap-server
        - kafka:29092
        - --list
      interval: 10s
      timeout: 10s
      retries: 60

  connect-jdbc:
    build:
      context: .
      dockerfile: docker/Dockerfile.jdbc
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/opt/plugins
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx1g
      CONNECT_REST_ADVERTISED_HOST_NAME: connect-jdbc
      CONNECT_GROUP_ID: jdbc-workers
      CONNECT_CONFIG_STORAGE_TOPIC: jdbc-configs
      CONNECT_OFFSET_STORAGE_TOPIC: jdbc-offsets
      CONNECT_STATUS_STORAGE_TOPIC: jdbc-status
    ports:
      - 127.0.0.1:8083:8083
    depends_on:
      kafka:
        condition: service_healthy
      oracle:
        condition: service_healthy

  connect-cdc:
    build:
      context: .
      dockerfile: docker/Dockerfile.cdc
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/opt/plugins
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx1g
      CONNECT_REST_ADVERTISED_HOST_NAME: connect-cdc
      CONNECT_GROUP_ID: cdc-workers
      CONNECT_CONFIG_STORAGE_TOPIC: cdc-configs
      CONNECT_OFFSET_STORAGE_TOPIC: cdc-offsets
      CONNECT_STATUS_STORAGE_TOPIC: cdc-status
    ports:
      - 127.0.0.1:8084:8083
    depends_on:
      kafka:
        condition: service_healthy
      oracle:
        condition: service_healthy

volumes:
  oracle-data: null
  kafka-data: null
